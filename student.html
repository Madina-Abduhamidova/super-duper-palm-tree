<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD</title>
    <!-- css -->
    <link rel="stylesheet" href="./css/student.css" />
  </head>
  <body>
    <header>
      <nav class="container">
        <h3 class="logo"><a href="./index.html">Users</a></h3>

        <div class="links">
          <a class="link" href="./student.html">Student</a>
          <a class="link" href="./index.html">Users</a>
        </div>
      </nav>
    </header>

    <main>
      <section>
        <div class="container addUser">
          <button class="add-btn">Add User</button>
        </div>
      </section>
      <section class="users-wrapper">
        <div class="user-card">
          <div class="card-header">
            <div class="avatar">KU</div>
            <div class="user-main">
              <span class="user-id" name="userId">${id}</span>
              <h2 class="user-name" name="userName">${fullName}</h2>
              <p class="user-course" name="userCourse">${course}</p>
            </div>
          </div>

          <div class="card-divider"></div>

          <div class="card-stats">
            <div class="stat-item">
              <span class="stat-label">Age</span>
              <span class="stat-value" name="userAge">${age}</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Grade</span>
              <span class="stat-value" name="userGrade">${grade}</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Status</span>
              <span class="badge" name="userStatus"
                >${isGraduated ? `Bitirgan ` : `Bitirmagan`}</span
              >
            </div>
          </div>
        </div>
      </section>
    </main>
    <div id="addUserModal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Yangi talaba qo'shish</h2>
          <a href="#" class="close-btn" title="Yopish">&times;</a>
        </div>

        <form class="modal-form">
          <!-- fullName -->
          <div class="form-group">
            <label for="fullName">F.I.Sh. (To'liq ism)</label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Masalan: Nilufar Azimova"
              required
            />
          </div>

          <!-- age & grade в одну строку для удобства -->
          <div class="form-row">
            <div class="form-group">
              <label for="age">Yoshi</label>
              <input
                type="number"
                id="age"
                name="age"
                min="10"
                max="100"
                placeholder="19"
                required
              />
            </div>

            <div class="form-group">
              <label for="grade">Bahosi (0-100)</label>
              <input
                type="number"
                id="grade"
                name="grade"
                min="0"
                max="100"
                placeholder="88"
                required
              />
            </div>
          </div>

          <!-- course -->
          <div class="form-group">
            <label for="course">Kurs nomi</label>
            <select id="course" name="course" required>
              <option value="" disabled selected>Kursni tanlang...</option>
              <option value="UI/UX Design">UI/UX Design</option>
              <option value="Frontend Development">Frontend Development</option>
              <option value="Backend Development">Backend Development</option>
              <option value="Mobile Development">Mobile Development</option>
            </select>
          </div>

          <!-- isGraduated -->
          <div class="form-group checkbox-group">
            <input type="checkbox" id="isGraduated" name="isGraduated" />
            <label for="isGraduated">Bitirganmi? (O'qishni tamomlagan)</label>
          </div>

          <!-- Кнопки действий -->
          <div class="modal-footer">
            <a href="#" type="reset" class="btn btn-cancel">Bekor qilish</a>
            <button type="submit" class="btn btn-submit">Saqlash</button>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="./js/student.js"></script>
  </body>
</html>
